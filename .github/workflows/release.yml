name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - install.ps1

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
            binary: entangle.exe
            archive: zip
            asset: entangle-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: ""
            binary: entangle
            archive: tar.gz
            asset: entangle-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            rustflags: ""
            binary: entangle
            archive: tar.gz
            asset: entangle-x86_64-apple-darwin.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            binary: entangle
            archive: tar.gz
            asset: entangle-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p entangle --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p package
          cp "target/$TARGET/release/$BINARY" "package/$BINARY"
          cp README.md LICENSE-MIT LICENSE-APACHE package/
          tar -czf "$ASSET" -C package "$BINARY" README.md LICENSE-MIT LICENSE-APACHE
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
        run: |
          New-Item -Path package -ItemType Directory -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BINARY" -Destination "package/$env:BINARY"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE -Destination package
          Compress-Archive -Path package\* -DestinationPath $env:ASSET -Force
      - uses: actions/upload-artifact@v4
        with:
          name: entangle-${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$tag" != "$version" ]; then
            printf 'Tag version %s does not match workspace version %s\n' "$tag" "$version" >&2
            exit 1
          fi
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum entangle-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/entangle-x86_64-pc-windows-msvc.zip
            dist/entangle-aarch64-apple-darwin.tar.gz
            dist/entangle-x86_64-apple-darwin.tar.gz
            dist/entangle-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS

[package]
name = "entangle-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
entangle-core = { path = "../entangle-core" }
hex.workspace = true
rand.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.0"

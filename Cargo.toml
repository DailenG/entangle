[workspace]
members = [
    "crates/entangle-core",
    "crates/entangle-resonance",
    "crates/entangle-transport",
    "crates/entangle-link",
    "crates/entangle-mcp",
    ".",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Dailen Gunter"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"
mdns-sd = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6.0"
clap = { version = "4.0", features = ["derive", "env"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "entangle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
entangle-core = { path = "crates/entangle-core" }
entangle-resonance = { path = "crates/entangle-resonance" }
entangle-transport = { path = "crates/entangle-transport" }
entangle-link = { path = "crates/entangle-link" }
entangle-mcp = { path = "crates/entangle-mcp" }
async-trait.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.0"

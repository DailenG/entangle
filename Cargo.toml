[workspace]
members = [
    "crates/entangle-core",
    "crates/entangle-resonance",
    "crates/entangle-transport",
    "crates/entangle-link",
    "crates/entangle-mcp",
    "crates/entangle",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
authors = ["Dailen Gunter"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"
mdns-sd = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6.0"
gethostname = "0.4"
clap = { version = "4.0", features = ["derive", "env"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
